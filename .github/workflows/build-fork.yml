name: build-ax6000
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-fork.yml'

permissions:
  contents: write

env:
  COMMIT: 8fd3008be125e590664b311e3aaedee344adc354

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 释放磁盘
        uses: sbwml/actions@free-disk

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget swig xsltproc ccache

      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 拉取源码并锁定提交
        run: |
          mkdir src && cd src
          git init -q .
          git remote add o https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
          git fetch --depth 1 o "$COMMIT"
          git checkout -q FETCH_HEAD
          echo ">>> $(git log -1 --format='%h %cd %s' --date=short)"
          grep -E 'SUBTARGETS|KERNEL_PATCHVER' target/linux/mediatek/Makefile
          grep -q 'KERNEL_PATCHVER:=5.4' target/linux/mediatek/Makefile
          grep -q 'mt7986' target/linux/mediatek/Makefile

      - name: 更新 feeds（含 mosdns 三方源）
        working-directory: src
        run: |
          echo 'src-git mosdns https://github.com/sbwml/luci-app-mosdns.git;v5-lua' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "----- mosdns 包是否可见 -----"
          ./scripts/feeds list -n | grep -E '^(mosdns|luci-app-mosdns|v2dat)$' || echo "!! 没找到 mosdns 相关包"

      - name: 注入默认配置（刷完首次开机自动生效）
        run: |
          mkdir -p src/package/base-files/files/etc/uci-defaults
          F=src/package/base-files/files/etc/uci-defaults/99-ax6000
          {
            echo '#!/bin/sh'
            echo "uci set system.@system[0].hostname='AX6000'"
            echo "uci -q delete network.wan6"
            echo "uci set network.lan.ip6assign='0'"
            echo "uci set dhcp.lan.ra='disabled'"
            echo "uci set dhcp.lan.dhcpv6='disabled'"
            echo "uci set dhcp.lan.ndp='disabled'"
            echo "/etc/init.d/odhcpd disable"
            echo "/etc/init.d/odhcpd stop"
            echo "uci set dhcp.@dnsmasq[0].noresolv='1'"
            echo "uci -q delete dhcp.@dnsmasq[0].server"
            echo "uci add_list dhcp.@dnsmasq[0].server='127.0.0.1#5335'"
            echo "uci set dhcp.@dnsmasq[0].rebind_protection='0'"
            echo "uci set dhcp.@dnsmasq[0].filter_aaaa='1'"
            echo "uci set mosdns.config.enabled='1'"
            echo "uci set mosdns.config.cache='1'"
            echo "uci set mosdns.config.redirect='0'"
            echo "uci set mosdns.config.concurrent='2'"
            echo "uci set mosdns.config.prefer_ipv4='1'"
            echo "uci -q delete mosdns.config.remote_dns"
            echo "uci add_list mosdns.config.remote_dns='https://1.1.1.1/dns-query'"
            echo "uci add_list mosdns.config.remote_dns='https://dns.google/dns-query'"
            echo "uci -q delete firewall.stun_block"
            echo "uci set firewall.stun_block='rule'"
            echo "uci set firewall.stun_block.name='Block-STUN'"
            echo "uci set firewall.stun_block.src='lan'"
            echo "uci set firewall.stun_block.proto='udp'"
            echo "uci set firewall.stun_block.dest_port='3478 3479 19302 19303'"
            echo "uci set firewall.stun_block.target='REJECT'"
            echo "uci commit"
            echo "exit 0"
          } > "$F"
          chmod +x "$F"
          echo "----- 注入的脚本 -----"
          cat "$F"

      - name: 生成配置
        run: |
          cd src
          cat defconfig/mt7986-ax6000.config > .config
          grep -vE 'mediatek_mt7986_DEVICE_(glinet_gl-mt6000|tplink_tl-xdr608[68])' .config > c.tmp && mv c.tmp .config
          cat ../package.append >> .config
          make defconfig
          echo "----- 设备 -----"; grep -E 'CONFIG_TARGET_(MULTI_PROFILE|DEVICE_mediatek)' .config || true
          echo "----- 代理/DNS -----"; grep -E 'CONFIG_PACKAGE_luci-app-(passwall|mosdns)|CONFIG_PACKAGE_mosdns|CONFIG_PACKAGE_dnsmasq_full' .config || true
          echo "----- 无线 -----"; grep -E 'CONFIG_MTK_(MT_WIFI|DOT11_HE_AX|WHNAT)' .config || true
          grep -q '^CONFIG_TARGET_DEVICE_mediatek_mt7986_DEVICE_xiaomi_redmi-router-ax6000=y$' .config || { echo "::error::AX6000 设备未选中"; exit 1; }
          grep -q '^CONFIG_PACKAGE_luci-app-passwall=y$' .config || { echo "::error::PassWall 未选中"; exit 1; }
          grep -q '^CONFIG_PACKAGE_luci-app-mosdns=y$' .config || { echo "::error::MosDNS 未选中"; exit 1; }
          grep -q '^CONFIG_PACKAGE_dnsmasq_full=y$' .config || { echo "::error::dnsmasq-full 未选中"; exit 1; }
          grep -q '^# CONFIG_PACKAGE_dnsmasq is not set$' .config || { echo "::error::dnsmasq 未关闭"; exit 1; }

      - name: 确认默认配置会被打进固件
        run: |
          F=src/package/base-files/files/etc/uci-defaults/99-ax6000
          test -f "$F" || { echo "::error::默认配置脚本没写进去"; exit 1; }
          grep -q 'Block-STUN' "$F" || { echo "::error::STUN 规则缺失"; exit 1; }
          grep -q "127.0.0.1#5335" "$F" || { echo "::error::MosDNS 指向缺失"; exit 1; }
          echo ">>> OK：默认配置随 base-files 一起打包"

      - name: 下载源码包
        working-directory: src
        run: make download -j8 || make download -j1 V=s

      - name: 编译
        working-directory: src
        run: make -j$(nproc) || { make -j1 V=s 2>&1 | tail -60; exit 1; }

      - name: 收集产物
        run: |
          mkdir out
          find src/bin/targets -type f \( -name '*.bin' -o -name '*.ubi' -o -name '*.manifest' \) -exec cp {} out/ \;
          ls -lh out
          ls out | grep xiaomi_redmi-router-ax6000
          cat src/version.buildinfo 2>/dev/null || true

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ax6000-r${{ github.run_number }}
          name: AX6000 23.05 r${{ github.run_number }}
          files: out/*
